openapi: 3.0.3
info:
  title: HongCafe Global - Profile API
  description: |
    프로필 API (조회, 수정, 비밀번호 변경, 탈퇴, 코인, SNS 연동, 이용 내역)

    ## 인증
    - 모든 EP JWT 필수 (`hc_access` HttpOnly 쿠키)

    ## CSRF
    - POST/PUT/DELETE 요청 시 `X-CSRF-TOKEN` 헤더 필수
    - GET 요청은 CSRF 검증 생략
  version: 1.1.0

servers:
  - url: https://prd.gl.hongcafe.com
    description: Production
  - url: https://stg.gl.hongcafe.com
    description: Staging
  - url: https://dev.gl.hongcafe.com
    description: Development

tags:
  - name: Profile
    description: 프로필 조회/수정
  - name: Password
    description: 비밀번호 변경
  - name: Account
    description: 계정 관리
  - name: Coin
    description: 코인
  - name: SNS
    description: SNS 연동
  - name: History
    description: 이용 내역

paths:
  /api/profile:
    get:
      tags: [Profile]
      summary: "내 프로필 조회"
      description: JWT 토큰의 acId 기반 프로필 조회
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProfileData"
              example:
                data:
                  acId: "test_mo28mgt9_sl4d@example.com"
                  acNick: "tstmgt9sl4"
                  crCode: "CR-20260417013914-813"
                  crPhone: "0807012345678"
                  countryCode: "US"
                  acRemainCoin: 500
                  acRemainFreeCoin: 200
                  acRemainPayCoin: 300
                  acHomeSet: "hongcafe"
                  acSmsCf: "Y"
                  acEmailCf: "Y"
                  acNotiCf: "Y"
                  acRegPath: "hongcafe"
                  registDate: "2026-04-17 01:39:14"
                  lastLoginDate: "2026-04-17 02:26:41"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Profile]
      summary: "프로필 수정"
      description: 허용 필드만 수정 (화이트리스트 방식). 최소 1개 필드 필수
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acNick:
                  type: string
                  minLength: 2
                  maxLength: 12
                  description: 닉네임
                acHomeSet:
                  type: string
                  description: 홈 화면 설정
                acSmsCf:
                  type: string
                  enum: ["Y", "N"]
                  description: SMS 알림
                acEmailCf:
                  type: string
                  enum: ["Y", "N"]
                  description: 이메일 알림
                acNotiCf:
                  type: string
                  enum: ["Y", "N"]
                  description: 푸시 알림
            example:
              acNick: "newnick2026"
              acHomeSet: "call"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              example: []
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [Account]
      summary: "회원 탈퇴"
      description: 성공 시 hc_access/hc_refresh 쿠키 만료 처리
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "200":
          description: 탈퇴 성공
          content:
            application/json:
              example: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/profile/password:
    put:
      tags: [Password]
      summary: "비밀번호 변경"
      description: 현재 비밀번호 확인 후 새 비밀번호로 변경
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, newPasswordRe]
              properties:
                currentPassword:
                  type: string
                  description: 현재 비밀번호
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: 새 비밀번호
                newPasswordRe:
                  type: string
                  description: 새 비밀번호 확인
            example:
              currentPassword: "TestPass1234!@"
              newPassword: "NewPass5678!@"
              newPasswordRe: "NewPass5678!@"
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile/coin:
    get:
      tags: [Coin]
      summary: "코인 잔액 요약"
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CoinSummary"
              example:
                data:
                  remainCoin: 500
                  remainFreeCoin: 200
                  remainPayCoin: 300
                  totalCharged: 10000
                  totalUsed: 9500
                  totalRefunded: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/profile/link-sns:
    post:
      tags: [SNS]
      summary: "SNS 계정 연동"
      description: 이미 다른 SNS가 연동된 경우 불가
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
        - $ref: "#/components/parameters/XCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snsType, acSnsId]
              properties:
                snsType:
                  type: string
                  enum: [google, kakao, naver, facebook, apple, line]
                  description: SNS 유형
                acSnsId:
                  type: string
                  description: SNS 계정 ID
            example:
              snsType: "google"
              acSnsId: "test_sns_mo28mgt9"
      responses:
        "200":
          description: 연동 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      snsType:
                        type: string
                        example: "google"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/profile/unlink-sns:
    post:
      tags: [SNS]
      summary: "SNS 연동 해제"
      description: 비밀번호 미설정(SNS 전용) 계정은 해제 불가
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "200":
          description: 해제 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/profile/history:
    get:
      tags: [History]
      summary: "이용 내역 조회"
      description: 상담/코인/결제 유형별 이용 내역
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XForwardedProto"
        - name: type
          in: query
          schema:
            type: string
            enum: [counsel, coin, payment]
            default: counsel
          description: 내역 유형
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: 페이지당 항목 수
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: 시작 오프셋
        - name: term
          in: query
          schema:
            type: integer
            default: 3
          description: 조회 기간 (월 단위)
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hc_access
      description: JWT Access Token (HttpOnly, Secure, SameSite=Lax, 15분 TTL)
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: hc_refresh
      description: Refresh Token (HttpOnly, Secure, single-use, 7일 TTL)

  parameters:
    XCsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: CSRF 토큰 (hc_csrf 쿠키 값)

    XForwardedProto:
      name: X-Forwarded-Proto
      in: header
      required: true
      schema:
        type: string
        default: https
      description: 모든 환경 필수

  schemas:
    ProfileData:
      type: object
      properties:
        acId:
          type: string
          description: 이메일
        acNick:
          type: string
          description: 닉네임
        crCode:
          type: string
          description: 고객 코드
        crPhone:
          type: string
          description: 전화번호
        countryCode:
          type: string
          description: 국가 코드
        acRemainCoin:
          type: integer
          description: 총 잔여 코인
        acRemainFreeCoin:
          type: integer
          description: 무료 코인 잔액
        acRemainPayCoin:
          type: integer
          description: 유료 코인 잔액
        acHomeSet:
          type: string
          description: 홈 화면 설정
        acSmsCf:
          type: string
          enum: ["Y", "N"]
          description: SMS 알림 설정
        acEmailCf:
          type: string
          enum: ["Y", "N"]
          description: 이메일 알림 설정
        acNotiCf:
          type: string
          enum: ["Y", "N"]
          description: 푸시 알림 설정
        acRegPath:
          type: string
          description: 가입 경로
        registDate:
          type: string
          format: date-time
          description: 가입 일시
        lastLoginDate:
          type: string
          format: date-time
          description: 최근 로그인 일시

    CoinSummary:
      type: object
      properties:
        remainCoin:
          type: integer
          description: 총 잔여 코인
        remainFreeCoin:
          type: integer
          description: 무료 코인 잔액
        remainPayCoin:
          type: integer
          description: 유료 코인 잔액
        totalCharged:
          type: integer
          description: 총 충전 코인
        totalUsed:
          type: integer
          description: 총 사용 코인
        totalRefunded:
          type: integer
          description: 총 환불 코인

    NullDataResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    ValidationFailed:
      description: 입력 검증 실패 (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: 인증 실패 (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: 접근 거부 (403)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: 리소스 없음 (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: 리소스 충돌 (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: 서버 내부 오류 (500)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: 요청 한도 초과 (429)
      headers:
        Retry-After:
          schema:
            type: integer
          description: 재시도까지 대기 시간 (초)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "요청 한도를 초과하였습니다. 잠시 후 다시 시도해 주세요."
